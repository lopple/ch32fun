name: Release minichlink

on:
  push:
    tags:
      - "b003boot-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: b003boot-c003-reset-test.2
        type: string

permissions:
  contents: write

env:
  MINICHLINK_TOOL_VERSION: b003boot-c003-reset-test.2

jobs:
  release-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install macOS dependencies
        run: |
          brew update
          brew install automake autoconf libtool

      - name: Build libusb for macOS ARM64 and x86_64
        run: |
          git clone --branch v1.0.29 --depth 1 https://github.com/libusb/libusb.git
          cd libusb

          mkdir build-arm64
          cd build-arm64
          ../autogen.sh CFLAGS="-arch arm64" LDFLAGS="-arch arm64" --disable-shared --enable-static
          make -C libusb -j"$(sysctl -n hw.logicalcpu)"
          cd ..

          mkdir build-x86_64
          cd build-x86_64
          ../autogen.sh CFLAGS="-arch x86_64" LDFLAGS="-arch x86_64" --disable-shared --enable-static
          make -C libusb -j"$(sysctl -n hw.logicalcpu)"
          cd ..

      - name: Merge universal libusb
        run: |
          mkdir -p universal/lib universal/include/libusb-1.0
          lipo -create \
            libusb/build-arm64/libusb/.libs/libusb-1.0.a \
            libusb/build-x86_64/libusb/.libs/libusb-1.0.a \
            -output universal/lib/libusb-1.0.a
          cp libusb/libusb/libusb.h universal/include/libusb-1.0/

      - name: Build minichlink for macOS ARM64
        run: |
          cd minichlink
          make clean
          make ARCH=arm64 VERSION="$MINICHLINK_TOOL_VERSION" \
            LIBUSB_INCS="-I$(pwd)/../universal/include/libusb-1.0" \
            LIBUSB_LIBS="$(pwd)/../universal/lib/libusb-1.0.a"
          mkdir -p ../dist/arm64
          cp minichlink minichlink.so ../dist/arm64/

      - name: Build minichlink for macOS x86_64
        run: |
          cd minichlink
          make clean
          make ARCH=x86_64 VERSION="$MINICHLINK_TOOL_VERSION" \
            LIBUSB_INCS="-I$(pwd)/../universal/include/libusb-1.0" \
            LIBUSB_LIBS="$(pwd)/../universal/lib/libusb-1.0.a"
          mkdir -p ../dist/x86_64
          cp minichlink minichlink.so ../dist/x86_64/

      - name: Package Arduino tool archive
        run: |
          mkdir -p tmp/universal
          lipo -create dist/arm64/minichlink dist/x86_64/minichlink -output tmp/universal/minichlink
          lipo -create dist/arm64/minichlink.so dist/x86_64/minichlink.so -output tmp/universal/minichlink.so
          tool_root="minichlink-$MINICHLINK_TOOL_VERSION-macos-universal"
          mkdir -p "tmp/$tool_root/bin"
          cp tmp/universal/minichlink "tmp/$tool_root/bin/minichlink"
          cp tmp/universal/minichlink.so "tmp/$tool_root/bin/minichlink.so"
          chmod +x "tmp/$tool_root/bin/minichlink"
          archive="minichlink-$MINICHLINK_TOOL_VERSION-macos-universal-arduino-tool.tar.gz"
          tar czf "$archive" -C tmp "$tool_root"
          shasum -a 256 "$archive" | sed "s/  / */" > "$archive.sha256"

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: minichlink ${{ steps.release.outputs.tag }}
          prerelease: true
          files: |
            minichlink-${{ env.MINICHLINK_TOOL_VERSION }}-macos-universal-arduino-tool.tar.gz
            minichlink-${{ env.MINICHLINK_TOOL_VERSION }}-macos-universal-arduino-tool.tar.gz.sha256